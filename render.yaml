services:
  - type: web
    name: crop-disease-detector
    env: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    healthCheckPath: /
    envVars:
      - key: MODEL_URL
        value: https://github.com/VijayUchiha2004/Crop_Disease_Detector/releases/download/v1.0.0/crop_disease_model.h5
